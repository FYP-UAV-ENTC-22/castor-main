# The vehicle component of three drones on one machine, for the PX4 SITL run (px4_rig.py):
# one uXRCE-DDS agent and one vehicle_interface per PX4 instance, setpoint forwarding on.
#
#   docker compose -f px4_stack.yml up -d        (after `make vehicle-image` in the repo root)
#   docker compose -f px4_stack.yml run --rm flight
#   docker compose -f px4_stack.yml down
#
# All three share this host's DDS graph (domain 20, loopback only), which stands in for the zenoh bridge
# between drones; `flight` is the test's ground station and policy runner, see px4_flight.py.

name: castor-px4

x-vehicle: &vehicle
  image: ${CASTOR_REGISTRY:-ghcr.io/fyp-uav-entc-22}/castor-vehicle:${CASTOR_TAG:-local}
  network_mode: host
  ipc: host
  pid: host
  init: true
  stop_signal: SIGINT
  stop_grace_period: 15s
  environment:
    ROS_DOMAIN_ID: "20"
    CASTOR_ROBOT_CONFIG: /etc/castor/robot.yaml
  command: ["ros2", "launch", "vehicle_launch", "vehicle.launch.py", "enable_setpoint_output:=true"]

services:
  vehicle1:
    <<: *vehicle
    volumes: ["./robots/drone1.yaml:/etc/castor/robot.yaml:ro"]
  vehicle2:
    <<: *vehicle
    volumes: ["./robots/drone2.yaml:/etc/castor/robot.yaml:ro"]
  vehicle3:
    <<: *vehicle
    volumes: ["./robots/drone3.yaml:/etc/castor/robot.yaml:ro"]

  flight:
    <<: *vehicle
    profiles: ["flight"]          # started on demand with `run`, not by `up`
    stdin_open: true
    tty: true
    environment:
      ROS_DOMAIN_ID: "20"
      CASTOR_ROBOT_CONFIG: /etc/castor/robot.yaml
      CASTOR_MODELS_ROOT: /models
    volumes:
      - ./robots/drone1.yaml:/etc/castor/robot.yaml:ro
      - .:/work
      - ../../../../models:/models:ro
    working_dir: /work
    command: ["python3", "px4_flight.py"]
