# robot.yaml for drone 1 of the PX4 SITL run (px4_rig.py): PX4 instance 0, its uXRCE-DDS client on
# udp 8888 with namespace px4_1. See deploy/robot.example.yaml for every key.

robot:
  id: 1
  namespace: drone1
  hardware: laptop

team:
  size: 3
  index: 0

fc:
  enabled: true
  transport: udp
  udp_port: 8888
  px4_namespace: px4_1

zenoh:
  connect: []
  multicast_scouting: false
