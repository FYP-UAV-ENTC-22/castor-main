# robot.yaml for drone 2 of the PX4 SITL run (px4_rig.py): PX4 instance 1, its uXRCE-DDS client on
# udp 8889 with namespace px4_2. See deploy/robot.example.yaml for every key.

robot:
  id: 2
  namespace: drone2
  hardware: laptop

team:
  size: 3
  index: 1

fc:
  enabled: true
  transport: udp
  udp_port: 8889
  px4_namespace: px4_2

zenoh:
  connect: []
  multicast_scouting: false
