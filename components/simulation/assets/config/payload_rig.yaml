# N drones carrying one cylindrical payload on cables, flycrane-style.
#
# Units: m, kg, N, s. "flycrane" means the MARL_mav_carry_ext flycrane assets, which several defaults copy. Training
# loads flycrane_rod/flycrane_rod.usd (one 1.0 m rod per drone); flycrane_offset/flycrane.usd has the 7-segment rope.
# Override any key on the command line with --set key=value, e.g. --set num_drones=4 --set cable.length=1.2

num_drones: 3                   # >= 1. Anchors sit at equal spacing around the payload (circumference / N) and
                                # each drone lines up with its anchor
vehicle: s500                   # s500 | iris (Pegasus' Iris: no landing-gear rod, the cable ties under the body)
vehicle_config: s500.yaml

payload:                        # solid cylinder, axis vertical. Values below match the MARL training payload
                                # (flycrane_rod: a 0.55 x 0.45 x 0.15 m, 1.4 kg box) as far as a cylinder can
  radius: 0.275                 # half the training box's 0.55 m side; its anchors sit at x = +-0.27
  height: 0.15                  # training box height
  mass: 1.4                     # training payload (marl_hover_env_cfg); was 0.4 (flycrane load_link)
  com_offset: [0.0, 0.0, 0.0]   # from the cylinder centre
  inertia: [0.02625, 0.0379, 0.0589]  # [ixx, iyy, izz] about the CoM; the training box's. null = solid cylinder
  anchor_radius: null           # cable attach radius from the axis; null = on the rim, or the centre when N = 1
  anchor_height: null           # from the cylinder centre; null = top face
  angle_offset_deg: 0.0         # azimuth of anchor 0, from +x

formation:
  horizontal_distance: null     # m from the payload axis to each drone's cable mount; overrides cable_angle_deg
  cable_angle_deg: 28.65        # cable angle from vertical at spawn; flycrane spawns its ropes at 0.5 rad
  drone_yaw: zero               # zero = every drone faces +x; outward = each faces away from the payload
  min_rotor_clearance: 0.10     # m; the layout is rejected if neighbouring rotor discs come closer than this

mount:                          # cross rod between the two landing-gear poles; the cable ties to its centre
  height: 0.14                  # m below the top of the poles: 0 = just under the frame, landing_gear.pole_length =
                                # bottom of the poles. Below ~0.06 the rod meets the stock battery mount.
  rod_diameter: 0.010

cable:
  model: distance               # distance = PhysX distance joint (option C); rope = rigid segments + ball joints (A)
  length: 1.0                   # the training rods (flycrane_rod: 1.0 m); was 2.0
  radius: 0.0025                # flycrane. Visual thickness, and the collider radius for rope segments
  # distance model
  stiffness: 20000.0            # N/m spring on the length limit, i.e. cable stretch; null = rigid limit
  damping: 5.0                 # N s/m
  # rope model
  segments: 7                   # flycrane_offset: 7 x 0.143 m. 1 = one rigid rod, which is what training uses
  mass: 0.0236                  # kg per cable; flycrane: 7 x 3.37 g
  joint_damping: 0.005          # N m s/rad on every ball joint, flycrane's value
  flycrane_inertia: true        # 1e-5 kg m^2 on every segment axis, as flycrane does; false = solid-rod inertia
  collisions: false             # rope segments collide with drones, payload and ground

release:                        # where the hardware has release mechanisms
  location: both                # none | drone (cable-to-drone) | payload (payload-to-cable) | both
  actuation_delay: 0.0          # s from command to release, e.g. servo travel

spawn:
  payload_clearance: 1.5        # m, payload bottom above the ground
  position: [0.0, 0.0]          # payload axis, x y

physics:                        # PhysX solver iterations for the payload and rope bodies
  solver_position_iterations: 32
  solver_velocity_iterations: 1
