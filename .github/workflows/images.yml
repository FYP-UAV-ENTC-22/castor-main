# Build, test and publish the CASTOR runtime images to GHCR.
#
#   pull request   build + colcon test every changed component, for amd64 and arm64; push nothing
#   push to main   the same, then push ghcr.io/fyp-uav-entc-22/castor-<component>:main and :sha-<rev>;
#                  components this push didn't touch get :sha-<rev> on their current
#                  :main, so one sha tag always names a complete fleet build
#   tag v*         the same for every component, plus :<tag>
#
# Nothing on GHCR is untagged: each platform is pushed as :sha-<rev>-<arch>, the
# multi-arch :main / :sha-<rev> index is made from those, builds carry no
# attestations, and the build cache lives in the GitHub Actions cache.
#
# arm64 builds run natively on GitHub's free arm64 runners (public repos), so
# there is no QEMU emulation. Pis never update on their own; they pick a new
# build up only when someone runs castor-update on them.
#
# The simulation image is not built here: it is based on NVIDIA's Isaac Sim
# image, which may not be republished publicly, and it is far too big for a
# hosted runner.

name: images

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "components/common/**"
      - "components/vehicle/**"
      - "components/localization/**"
      - "components/planning/**"
      - "components/system/**"
      - "models/**"
      - "docker/**"
      - ".devcontainer/**"
      - ".dockerignore"
      - ".gitmodules"
      - ".github/workflows/images.yml"
  pull_request:
    paths:
      - "components/common/**"
      - "components/vehicle/**"
      - "components/localization/**"
      - "components/planning/**"
      - "components/system/**"
      - "models/**"
      - "docker/**"
      - ".devcontainer/**"
      - ".dockerignore"
      - ".gitmodules"
      - ".github/workflows/images.yml"
  workflow_dispatch:
    inputs:
      components:
        description: "Components to build, space-separated (empty = all)"
        required: false
        default: ""

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CASTOR_REGISTRY: ghcr.io/fyp-uav-entc-22
  # The zenoh bridge every drone runs, mirrored to GHCR as tagged images.
  ZENOH_UPSTREAM: eclipse/zenoh-bridge-ros2dds
  ZENOH_VERSION: "1.10.1"
  ZENOH_AMD64: sha256:6a3b8908e697d66eca1ca546779202b1f595ec6b4316f5cb16942cf8d58bc139
  ZENOH_ARM64: sha256:628d05f5c1f0b3f6555d34bb243090c8bc62ceb5894e3c7e69d583a5e56d5bac

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      components: ${{ steps.pick.outputs.components }}
      unchanged: ${{ steps.pick.outputs.unchanged }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          INPUT: ${{ github.event.inputs.components }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          all="vehicle localization planning system"
          if [ "$EVENT" = workflow_dispatch ]; then
            picked="${INPUT:-$all}"
          elif [ "$REF_TYPE" = tag ]; then
            picked="$all"
          else
            base="${PR_BASE:-$BEFORE}"
            if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              picked="$all"          # first push of a branch, or history not available
            else
              changed=$(git diff --name-only "$base" "$GITHUB_SHA")
              # Files under docker/ that never go into an onboard image (compose files, docs, the
              # host-side ROS setup, the simulation image) rebuild nothing: a rebuild only gives every
              # image a new revision label, and every Pi a pointless update. Keep in step with
              # castor_revision in docker/buildx_common.sh.
              changed=$(echo "$changed" | grep -vE '^docker/(docker-compose[^/]*\.yml|[^/]*\.md|host_ros_env\.sh|fastdds_host\.xml|build_simulation\.sh|simulation/)' || true)
              if echo "$changed" | grep -qE '^(components/common/|docker/|\.devcontainer/common/|\.dockerignore|\.gitmodules|\.github/workflows/images\.yml)'; then
                picked="$all"
              else
                picked=""
                for c in $all; do
                  echo "$changed" | grep -qE "^(components/$c/|\.devcontainer/$c/)" && picked="$picked $c"
                  [ "$c" = planning ] && echo "$changed" | grep -q '^models/' && [[ " $picked " != *" planning "* ]] \
                    && picked="$picked planning"
                done
              fi
            fi
          fi
          json=$(printf '%s\n' $picked | jq -R . | jq -cs 'map(select(length > 0))')
          rest=""
          for c in $all; do [[ " $picked " == *" $c "* ]] || rest="$rest $c"; done
          rest_json=$(printf '%s\n' $rest | jq -R . | jq -cs 'map(select(length > 0))')
          echo "components=$json" >> "$GITHUB_OUTPUT"
          echo "unchanged=$rest_json" >> "$GITHUB_OUTPUT"
          echo "building: $json   retagging: $rest_json"

  build:
    needs: plan
    if: needs.plan.outputs.components != '[]'
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.plan.outputs.components) }}
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: PX4 message definitions (vehicle only, no nested submodules)
        if: matrix.component == 'vehicle'
        run: git submodule update --init --depth 1 components/vehicle/PX4-Autopilot
      - uses: docker/setup-buildx-action@v3
      - name: Expose the Actions cache to buildx
        uses: crazy-max/ghaction-github-runtime@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Test and build (pull request)
        if: github.event_name == 'pull_request'
        run: docker/build_runtime.sh --platform linux/${{ matrix.arch }} --test --cache ${{ matrix.component }}
      - name: Test, build and push sha-<rev>-<arch>
        if: github.event_name != 'pull_request'
        run: docker/build_runtime.sh --platform linux/${{ matrix.arch }} --test --cache --push-arch "sha-${GITHUB_SHA::12}" ${{ matrix.component }}

  publish:
    needs: [plan, build]
    if: github.event_name != 'pull_request'
    strategy:
      matrix:
        component: ${{ fromJSON(needs.plan.outputs.components) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the multi-arch image
        env:
          IMAGE: ${{ env.CASTOR_REGISTRY }}/castor-${{ matrix.component }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          sha="sha-${GITHUB_SHA::12}"
          tags=(-t "$IMAGE:$sha")
          if [ "$REF_TYPE" = tag ]; then tags+=(-t "$IMAGE:$REF_NAME"); else tags+=(-t "$IMAGE:main"); fi
          docker buildx imagetools create "${tags[@]}" "$IMAGE:$sha-amd64" "$IMAGE:$sha-arm64"
          docker buildx imagetools inspect "$IMAGE:$sha"

  retag:
    # Components this push didn't rebuild: point sha-<rev> at their current main.
    needs: [plan, build]
    if: github.event_name == 'push' && github.ref_type == 'branch' && needs.plan.outputs.unchanged != '[]' && !failure() && !cancelled()
    strategy:
      matrix:
        component: ${{ fromJSON(needs.plan.outputs.unchanged) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Add sha-<rev> to main
        env:
          IMAGE: ${{ env.CASTOR_REGISTRY }}/castor-${{ matrix.component }}
        run: |
          if docker buildx imagetools inspect "$IMAGE:main" >/dev/null 2>&1; then
            docker buildx imagetools create --prefer-index=false -t "$IMAGE:sha-${GITHUB_SHA::12}" "$IMAGE:main"
          else
            echo "::warning::$IMAGE:main does not exist yet; nothing to retag"
          fi

  mirror:
    # The zenoh bridge, copied from Docker Hub by digest and tagged on GHCR.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Mirror zenoh-bridge-ros2dds
        run: |
          dst="$CASTOR_REGISTRY/zenoh-bridge-ros2dds"
          # --prefer-index=false copies each platform manifest unchanged
          docker buildx imagetools create --prefer-index=false -t "$dst:$ZENOH_VERSION-amd64" "$ZENOH_UPSTREAM@$ZENOH_AMD64"
          docker buildx imagetools create --prefer-index=false -t "$dst:$ZENOH_VERSION-arm64" "$ZENOH_UPSTREAM@$ZENOH_ARM64"
          docker buildx imagetools create -t "$dst:$ZENOH_VERSION" "$dst:$ZENOH_VERSION-amd64" "$dst:$ZENOH_VERSION-arm64"
          docker buildx imagetools inspect "$dst:$ZENOH_VERSION"
