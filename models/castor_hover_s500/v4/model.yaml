# One exported policy and everything needed to fly it. See models/README.md.
# A committed version never changes: a re-export or a retrain is a new version directory.

name: castor_hover_s500
version: v4
date: 2026-10-12
description: >-
  MAPPO payload policy for three S500s carrying a 0.4 kg disc of 0.3 m radius on 3 m cables: holds the payload and
  flies it to a goal pose by nudging each drone's RAPTOR position setpoint. Trained against a model of the
  aircraft's flight stack: RAPTOR at 400 Hz on PX4's estimate, the payload's own estimate over Wi-Fi, link and ESC
  delays, with a 1 m/s setpoint speed cap.
  Continued from step 75,000 of that run with a bonus for holding the drones still once the payload is at its goal.
  The finished run: best_agent.pt of the continuation, saved at about its step 120,000 (195,000 of 204,800
  overall). It has no policy_trace.npz yet, so check_model.py has not been run on it; the ONNX files were not
  cross-checked at export either (no onnxruntime in Isaac Sim's Python).

source:
  repo: FYP-UAV-ENTC-22/MARL_cooperative_aerial_manipulation_ext
  commit: null           # the task is uncommitted work on branch raptor_v3_px4_stack (on top of a241bdb)
  task: Isaac-castor-s500-px4-payload-decentralized-hovering-v0
  experiment: logs/skrl/mappo_castor_s500_px4_hover/2026-10-11_21-51-32_mappo_torch_s500_px4_v1 (resumed from agent_75000.pt of 2026-10-11_12-40-31; ran to the end, 129,792 steps)
  checkpoint: best_agent.pt
  exported_with: scripts/tools/export_policy_onnx.py
  trace_with: scripts/tools/capture_policy_trace.py --task Isaac-castor-s500-px4-payload-decentralized-hovering-v0

policy:
  team_size: 3
  frame_dim: 45          # payload pos 3, R 9, one-hot 3, own pos 3, R 9, v 3, w 3, goal - payload 3, R_goal R^T 9
  history: 3             # frames, oldest first: 135 inputs
  action_dim: 3          # position increment
  rate_hz: 50
  slots:                 # team slot i loads slots[i]; the input scaler is inside each file
    - file: policy_falcon1.onnx
      sha256: f3d1a05ab3aa2d5690ab18d2cd865ed09d99b8b3e92ed1eaaca80537afdb4f1b
    - file: policy_falcon2.onnx
      sha256: f3d1a05ab3aa2d5690ab18d2cd865ed09d99b8b3e92ed1eaaca80537afdb4f1b
    - file: policy_falcon3.onnx
      sha256: f3d1a05ab3aa2d5690ab18d2cd865ed09d99b8b3e92ed1eaaca80537afdb4f1b
  # The point on the drone the policy calls its position: body frame, from the body origin (FLU). This task
  # reports the body origin itself, the point PX4 estimates and RAPTOR flies.
  point_local: [0.0, 0.0, 0.0]

training:                # what the training environment did, for reference and parity
  setpoint_step_scale: 0.02
  setpoint_max_speed: 1.0
  setpoint_leash: 1.5

flight:                  # what the onboard runner uses (castor_policy parameters)
  # The trained settings.
  setpoint_step_scale: 0.02
  setpoint_max_speed: 1.0
  setpoint_leash: 1.5
  velocity_filter_s: 0.0
  velocity_gain: 1.0
  # The task's drone speed limits: training penalises a drone above the soft one and ends the episode at the hard
  # one. Onboard the setpoint's step shrinks from the soft limit and stops at the hard one.
  drone_speed_soft: 1.8
  drone_speed_limit: 2.0
  goal_box:                # payload goal positions seen in training, world frame; goals outside are clamped
    min: [-1.0, -1.0, 0.5]
    max: [1.0, 1.0, 1.5]

rig:                     # the rig this policy has to be flown on (components/simulation/assets/config)
  config: payload_rig_marl_s500.yaml
  cable_length: 3.0
  payload_height: 0.03
  mount_local: [0.0, 0.0, -0.1875]   # cable tie point, drone body frame (mount.height 0.163, level with the skids)
  anchors_local:                     # cable i's anchor on the payload, payload frame; slot i flies cable i
    - [0.3, 0.0, 0.015]
    - [-0.15, 0.259808, 0.015]
    - [-0.15, -0.259808, 0.015]
  drone_yaw_deg: [0.0, 120.0, 240.0]   # each drone faces away from the payload
  takeoff_height: 1.3    # m above home for PX4's take-off (px4_rig.py --takeoff_alt); the cables go taut near 2.65 m
  lift_height: 1.0       # payload centre above the ground when the policy takes over
