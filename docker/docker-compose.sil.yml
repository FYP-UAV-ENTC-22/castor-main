# SIL overlay for docker-compose.prod.yml (components/simulation/sil/sil.sh adds it):
# the simulated drone's vehicle component forwards setpoints and commands to its
# PX4 SITL instance, so the system layer's mission node can fly it. On a Pi both
# stay off (the prod defaults).
#
#   CASTOR_TAKEOFF_HEIGHT   metres above home before the mission node hands over to RAPTOR (default 2.0)

services:
  vehicle:
    command: ["ros2", "launch", "vehicle_launch", "vehicle.launch.py",
              "enable_setpoint_output:=true", "enable_commands:=true"]
  system:
    command: ["ros2", "launch", "system_launch", "system.launch.py",
              "takeoff_height:=${CASTOR_TAKEOFF_HEIGHT:-2.0}"]
